[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "karmasakshi-protocol"
version = "0.2.0"
description = "Verified Effect Commit Protocol for AI agents: binds approval to one exact resolved effect, revalidates preconditions at commit time, executes exactly once, and independently verifies the real outcome."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nishant Tyagi", email = "jollytyagi360@gmail.com" }]
keywords = [
    "ai-agents",
    "verified-effect",
    "effect-manifest",
    "toctou",
    "exactly-once",
    "action-passport",
    "agent-safety",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7,<3",
    "cryptography>=44.0,<50",
    "typer>=0.12,<1.0",
    "rich>=13.7,<16",
    "orjson>=3.10,<4",
    # RA-006: the base package installs the `karmasakshi-acceptance`
    # console script (project.scripts below), and it needs httpx at
    # runtime -- it must not be an optional extra a base install can omit.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<6"]
api = ["fastapi>=0.111,<1.0", "uvicorn[standard]>=0.30,<1.0", "jinja2>=3.1,<4", "python-multipart>=0.0.9", "httpx>=0.27,<1.0"]
langgraph = ["langgraph>=1.0.10,<2", "langchain-core>=1.0,<2", "langgraph-checkpoint>=4.1.1,<5"]
sdk = ["httpx>=0.27,<1.0"]
all = ["karmasakshi-protocol[redis,api,langgraph,sdk]"]

[project.scripts]
karmasakshi = "karmasakshi.cli.app:main"
karmasakshi-acceptance = "karmasakshi.acceptance:main"

[project.urls]
Homepage = "https://github.com/nishanttyagi28/karmasakshi-protocol"
Documentation = "https://github.com/nishanttyagi28/karmasakshi-protocol/tree/main/docs"
Issues = "https://github.com/nishanttyagi28/karmasakshi-protocol/issues"
Changelog = "https://github.com/nishanttyagi28/karmasakshi-protocol/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # RA-011: pytest<9 excluded the PYSEC-2026-1845 fix (9.0.3). pytest-asyncio
    # is bumped alongside it since 0.23-0.26 pin pytest<9.
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "mypy>=1.10,<3",
    "ruff>=0.5,<1.0",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "build>=1.2,<2",
    "twine>=6.0,<8",
    "httpx>=0.27,<1.0",
    "freezegun>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/karmasakshi"]

[tool.hatch.build.targets.sdist]
# Screenshots/demo video are for the README on GitHub, not needed to build
# or install the package -- excluding them keeps the sdist small.
exclude = ["docs/assets"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "N", "RUF", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S110", "E501", "RUF005"]
# Dev/demo tooling, not shipped in the package: fixed, non-user-controlled
# subprocess argument lists (ffmpeg/uvicorn) and a hardcoded localhost health
# check URL.
"scripts/**" = ["S603", "S310", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["karmasakshi"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# CI runs the pytest console script, which does not put the repo root on
# sys.path. examples/ and tests/ are imported from there.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "redis: requires a reachable Redis instance",
    "slow: slower integration-style tests",
]

[tool.coverage.run]
source = ["src/karmasakshi"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 0

[tool.bandit]
exclude_dirs = ["tests"]
