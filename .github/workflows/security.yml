name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r src/karmasakshi -c pyproject.toml

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      # RA-011: this used to install only the [all] runtime extras, so
      # pip-audit never scanned the dev dependency group (pytest et al.)
      # at all -- a real advisory (PYSEC-2026-1845, pytest<9.0.3) shipped
      # undetected here. --group installs the PEP 735 dependency-groups
      # entry from pyproject.toml alongside the runtime extras.
      - run: pip install -e ".[all]" --group dev
      - run: pip-audit --skip-editable

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
