name: Release

# Publishing is intentionally gated behind an explicit, human-triggered
# path: a pushed `v*` tag AND manual approval via the `pypi` GitHub
# Environment (configure required reviewers on that environment in repo
# settings). No PyPI token is stored anywhere in this repository --
# authentication uses PyPI's Trusted Publishing (OIDC).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/karmasakshi-protocol/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC) -- no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
